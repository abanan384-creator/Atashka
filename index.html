<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Помощник приёма лекарств</title>
  <meta name="description" content="Простой и надежный помощник напоминания о лекарствах для пожилых людей" />

  <!-- Цвет строки состояния мобильного браузера -->
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Лекарства" />

  <!-- Иконка и PWA-манифест -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Предотвращение вспышки белого экрана до загрузки React -->
  <style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      margin: 0;
    }
  </style>

  <script>
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        keys.forEach(function(k) {
          if (k === 'sma-cache-v1') caches.delete(k);
        });
      });
    }
  </script>

  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <noscript style="color: #ffffff; padding: 20px; font-size: 18px; text-align: center; display: block;">
    Для работы помощника приёма лекарств требуется включённый JavaScript.
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
